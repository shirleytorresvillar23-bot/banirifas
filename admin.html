
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | BaniRifas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      background: #1b1b1b;
      border: 1px solid #b99a48;
      border-radius: 18px;
    }
    h1 {
      color: #d8b75b;
      text-align: center;
      margin-bottom: 8px;
    }
    p { text-align: center; color: #bbb; }
    label { display: block; margin-top: 18px; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #292929;
      color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: #d8b75b;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #mensaje { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>BANIRIFAS</h1>
    <p>Acceso administrativo</p>

    <form id="login">
      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" required
             autocomplete="username">

      <label for="clave">Contraseña</label>
      <input id="clave" type="password" required
             autocomplete="current-password">

      <button id="entrar" type="submit">
        Iniciar sesión
      </button>
    </form>

    <p id="mensaje" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://hoscqebehcuwemaiifav.supabase.co",
      "sb_publishable_4kuB8_WytXyHsWDSk7XxBA_xh7tk83q"
    );

    const formulario = document.querySelector("#login");
    const mensaje = document.querySelector("#mensaje");
    const boton = document.querySelector("#entrar");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      boton.disabled = true;
      mensaje.textContent = "Verificando acceso...";

      const email = document.querySelector("#correo").value;
      const password = document.querySelector("#clave").value;

      try {
        const { error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        const { data, error: permisoError } =
          await supabase.rpc("es_admin_banirifas");

        if (permisoError) throw permisoError;

        if (data !== true) {
          await supabase.auth.signOut();
          mensaje.textContent = "Acceso no autorizado.";
          return;
        }

        mensaje.textContent =
          "Acceso administrativo confirmado.";
        formulario.reset();
        
const { data: pedidos, error: errorPedidos } =
  await supabase.rpc("listar_pedidos_banirifas");

if (errorPedidos) {
  mensaje.textContent =
    "Acceso confirmado, pero no se pudieron cargar los pedidos.";
  return;
}

const panel = document.createElement("section");
panel.style.marginTop = "25px";

const titulo = document.createElement("h2");
titulo.textContent = "Pedidos registrados";
titulo.style.color = "#d8b75b";
panel.appendChild(titulo);

if (!pedidos || pedidos.length === 0) {
  const vacio = document.createElement("p");
  vacio.textContent = "Todavía no hay pedidos.";
  panel.appendChild(vacio);
} else {
  pedidos.forEach((pedido) => {
    const tarjeta = document.createElement("div");
    tarjeta.style.cssText =
      "padding:15px;margin-top:12px;background:#292929;" +
      "border-radius:8px;border:1px solid #555;";

    const datos = [
      ["Rifa", pedido.rifa],
      ["Cliente", pedido.cliente],
      ["Boletos", pedido.cantidad_boletos],
      ["Importe", "RD$" + pedido.importe],
      ["Pedido", pedido.estado_pedido],
      ["Pago", pedido.estado_pago || "Sin registrar"]
    ];

    datos.forEach(([etiqueta, valor]) => {
      const linea = document.createElement("p");
      linea.style.textAlign = "left";
      linea.textContent = etiqueta + ": " + valor;
      tarjeta.appendChild(linea);
    });

    panel.appendChild(tarjeta);
  });
}

document.querySelector(".panel").appendChild(panel);
formulario.style.display = "none";
        
const { data: pagos, error: errorPagos } =
  await supabase.rpc("listar_pagos_banirifas");

const seccionPagos = document.createElement("section");
seccionPagos.style.marginTop = "30px";

const tituloPagos = document.createElement("h2");
tituloPagos.textContent = "Pagos pendientes de revisión";
tituloPagos.style.color = "#d8b75b";
seccionPagos.appendChild(tituloPagos);

if (errorPagos) {
  const aviso = document.createElement("p");
  aviso.textContent = "No se pudieron cargar los pagos.";
  seccionPagos.appendChild(aviso);
} else {
  const pendientes = (pagos || []).filter(
    pago => pago.estado_pago === "pending"
  );

  if (pendientes.length === 0) {
    const aviso = document.createElement("p");
    aviso.textContent = "No hay pagos pendientes.";
    seccionPagos.appendChild(aviso);
  }

  pendientes.forEach((pago) => {
    const tarjeta = document.createElement("div");
    tarjeta.style.cssText =
      "padding:15px;margin-top:12px;background:#292929;" +
      "border:1px solid #555;border-radius:8px;";

    const datos = [
      ["Cliente", pago.cliente],
      ["Rifa", pago.rifa],
      ["Importe", "RD$" + pago.importe],
      ["Estado", pago.estado_pago],
      ["Comprobante", pago.comprobante || "No enviado"]
    ];

    datos.forEach(([etiqueta, valor]) => {
      const linea = document.createElement("p");
      linea.style.textAlign = "left";
      linea.textContent = etiqueta + ": " + valor;
      tarjeta.appendChild(linea);
    });

    if (pago.comprobante?.startsWith("PRUEBA_INTERNA/")) {
      const aviso = document.createElement("p");
      aviso.textContent = "COMPROBANTE FICTICIO - NO APROBAR";
      aviso.style.color = "#ff7777";
      tarjeta.appendChild(aviso);
    }

    seccionPagos.appendChild(tarjeta);
  });
}

document.querySelector(".panel").appendChild(seccionPagos);



      } catch (error) {
        mensaje.textContent =
          "No se pudo iniciar sesión. Verifica tus datos.";
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
